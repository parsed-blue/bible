<nav class="pager">
    <span class="prev">
        {% if book.prev %}
        <a href="{{book.prev.href|urlencode}}">{{book.prev.display}}</a>
        {% else %}
        <a class="edge">the beginning</a>
        {% endif %}
    </span>
    <span class="next">
        {% if book.next %}
        <a href="{{book.next.href|urlencode}}">{{book.next.display}}</a>
        {% else %}
        <a class="edge">the end</a>
        {% endif %}
    </span>
</nav>
