<style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    :root {
        --bg: #000;
        --fg: #fff;
        --accent: #f50;
        --accent-white: #fff;
        --accent-hover: #ff7a3c;
        --muted: #8a98a6;
        --measure: 46rem;

        font-family: "Fira Sans", sans-serif;
        font-weight: 400;
        font-style: normal;

    }
 
    /* --- reset --- */
    *,
    *::before,
    *::after {
        box-sizing: border-box;
        font-family: "Fira Sans", sans-serif;
        font-weight: 400;
        font-style: normal;
    }
    * {
        margin: 0;
    }
    html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
    }
 
    body {
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
            Arial, sans-serif;
        font-size: clamp(1rem, 0.95rem + 0.3vw, 1.125rem);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
    }
 
    /* --- base elements --- */
    a {
        color: var(--accent);
        text-underline-offset: 0.15em;
    }
    a:hover {
        color: var(--accent-hover);
    }
    :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }
 
    h1,
    h3 {
        line-height: 1.15;
        font-weight: 700;
    }
    h3 {
        margin-top: 2rem;
        scroll-margin-top: 2rem;
    }
 
    dl {
        margin: 1rem 0;
    }
    dt {
        font-weight: 700;
        color: var(--accent);
    }
    dd {
        margin: 0 0 1rem;
    }
 
    /* --- layout --- */
    .container {
        max-width: var(--measure);
        margin-inline: auto;
        padding-inline: 1rem;
    }
    .text-center {
        text-align: center;
    }
    .accent {
        color: var(--accent);
    }
 
    .topbar {
        height: 0.35rem;
        background: var(--accent);
    }
 
    /* --- title --- */
    .display-title {
        font-size: clamp(1rem, 8vw, 2rem);
        text-transform: capitalize;
        margin: 1.5rem 0;
    }
 
    /* --- verse list --- */
    .chapter {
        padding-left: 1.4rem;
        margin: 1rem 0 2rem;
        line-height: 1.50;
        hyphens: auto;
    }
    .chapter li {
        margin-bottom: 0.4rem;
        scroll-margin-top: 40vh;
        padding: 0.4rem;
        border-radius: 0.5rem;
        transition: background 0.2s box-shadow 0.4s;
    }
    .chapter li div {
        display: flex;
        align-items: center;
        gap: 0.2rem;
    }
    .chapter li p {
        flex: 1;
    }
    .chapter li::marker {
        color: var(--accent); /* verse numbers */
    }
    .chapter li:target {
        background: rgba(255, 85, 0, 0.20);
        border-right: 1px solid var(--accent);
        box-shadow: inset 0px 0px 24px -12px var(--accent), 0 0 24px -12px white;
        text-shadow: 0 0 10px white;
    }
 
    /* --- de-emphasized reference anchors --- */
    .ref {
        font-size: 0.7rem;
        color: var(--muted);
        text-decoration: none;
    }
    .ref:hover {
        color: var(--accent);
    }
 
    /* --- wrapped book index --- */
    .booklist {
        text-align: center;
        font-size: 0.85rem;
        /*- line-height: 2; /* generous, for tap targets */
    }
    .booklist a {
        display: inline-block;
        white-space: nowrap;
        text-transform: capitalize;
        margin: 0 0.2rem;
        color: var(--fg);
        text-decoration: underline;
    }
    .booklist a:hover {
        color: var(--accent);
    }
    .booklist a.active {
        color: var(--accent);
        font-weight: 700;
    }
 
    /* --- prev/next pager --- */
    .pager {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 2rem 0;
        text-transform: capitalize;
    }
    .pager .prev {
        flex: 1;
        text-align: left;
    }
    .pager .next {
        flex: 1;
        text-align: right;
    }
    .pager a {
        text-decoration: none;
    }
    .pager a:hover {
        text-decoration: underline;
    }
    .pager .edge {
        color: var(--accent-white);
        cursor: not-allowed;
    }
 
    /* --- full-bleed footer bar --- */
    .footer-bar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        background: var(--accent);
        color: #000;
        font-weight: 700;
        font-size: 0.72rem;
    }
    .footer-bar a {
        color: #000;
    }
    .footer-bar .version {
        text-transform: uppercase;
    }
    .footer-bar .center {
        flex: 1;
        text-align: center;
    }
    .footer-bar strong {
        word-break: break-all;
    }
</style>
